; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Arduino Nano 3.0 with the old bootloader, which listens at 57600 baud. A Nano
; with Optiboot listens at 115200 and needs the board nanoatmega328new instead.
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
